<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Upper facets (light, golden) -->
    <linearGradient id="u-l" x1="0.5" y1="1" x2="0.1" y2="0">
      <stop offset="0%" stop-color="#F5C842"/>
      <stop offset="100%" stop-color="#FEF0B0"/>
    </linearGradient>
    <linearGradient id="u-r" x1="0.5" y1="1" x2="0.9" y2="0">
      <stop offset="0%" stop-color="#E8911E"/>
      <stop offset="100%" stop-color="#F5C040"/>
    </linearGradient>

    <!-- Mid facets (warm orange) -->
    <linearGradient id="m-l" x1="0.3" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#F5C842"/>
      <stop offset="100%" stop-color="#EF9F27"/>
    </linearGradient>
    <linearGradient id="m-r" x1="0.7" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#E08A1A"/>
      <stop offset="100%" stop-color="#D07020"/>
    </linearGradient>

    <!-- Lower facets (deep orange-red) -->
    <linearGradient id="l-l" x1="0.3" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#EF9F27"/>
      <stop offset="60%" stop-color="#D87020"/>
      <stop offset="100%" stop-color="#C04E20"/>
    </linearGradient>
    <linearGradient id="l-r" x1="0.7" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#D07020"/>
      <stop offset="60%" stop-color="#B85428"/>
      <stop offset="100%" stop-color="#943518"/>
    </linearGradient>

    <!-- Shine -->
    <linearGradient id="sh1" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFF" stop-opacity="0.5"/>
      <stop offset="20%" stop-color="#FFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sh2" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="sp" cx="0.28" cy="0.18" r="0.1">
      <stop offset="0%" stop-color="#FFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="gl" cx="0.46" cy="0.44" r="0.22">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#D85A30" stop-opacity="0"/>
    </radialGradient>

    <filter id="ds">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D85A30" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!--
    Elongated diamond crystal.
    Narrower equator, taller proportions.

    Apex:          256, 26
    Upper break:   168, 165  /  344, 165
    Equator:       105, 248  /  407, 248
    Lower break:   168, 355  /  344, 355
    Bottom:        256, 486

    Center front:  256, 145 (upper) / 256, 260 (equator) / 256, 370 (lower)
  -->

  <g filter="url(#ds)">
    <!-- === UPPER (apex to break) === -->
    <polygon points="256,26 168,165 256,145" fill="url(#u-l)"/>
    <polygon points="256,26 344,165 256,145" fill="url(#u-r)"/>

    <!-- === MID-UPPER (break to equator) === -->
    <polygon points="168,165 105,248 256,260 256,145" fill="url(#m-l)"/>
    <polygon points="344,165 407,248 256,260 256,145" fill="url(#m-r)"/>

    <!-- === MID-LOWER (equator to lower break) === -->
    <polygon points="105,248 168,355 256,370 256,260" fill="url(#l-l)"/>
    <polygon points="407,248 344,355 256,370 256,260" fill="url(#l-r)"/>

    <!-- === LOWER (break to bottom) === -->
    <polygon points="168,355 256,486 256,370" fill="#B84A20"/>
    <polygon points="344,355 256,486 256,370" fill="#943518"/>

    <!-- === INNER GLOW === -->
    <ellipse cx="250" cy="250" rx="55" ry="55" fill="url(#gl)"/>

    <!-- === REFLECTIONS === -->
    <!-- Upper-left shine -->
    <polygon points="253,36 170,162 225,255 254,100" fill="url(#sh1)"/>

    <!-- Lower-left reflected light -->
    <polygon points="125,258 170,350 205,360 155,305" fill="url(#sh2)"/>

    <!-- Specular on upper-left -->
    <ellipse cx="210" cy="110" rx="24" ry="14" fill="url(#sp)" transform="rotate(-12,210,110)"/>

    <!-- Faint right highlight -->
    <polygon points="280,150 340,168 395,245 290,255" fill="#FFF" opacity="0.03"/>

    <!-- === EDGE LINES === -->
    <!-- Center -->
    <line x1="256" y1="26" x2="256" y2="486" stroke="#FDE68A" stroke-opacity="0.12" stroke-width="1"/>
    <!-- Upper break -->
    <line x1="168" y1="165" x2="256" y2="145" stroke="#FDE68A" stroke-opacity="0.1" stroke-width="0.8"/>
    <line x1="344" y1="165" x2="256" y2="145" stroke="#FDE68A" stroke-opacity="0.08" stroke-width="0.8"/>
    <!-- Equator -->
    <line x1="105" y1="248" x2="256" y2="260" stroke="#FDE68A" stroke-opacity="0.12" stroke-width="0.8"/>
    <line x1="407" y1="248" x2="256" y2="260" stroke="#FDE68A" stroke-opacity="0.1" stroke-width="0.8"/>
    <!-- Lower break -->
    <line x1="168" y1="355" x2="256" y2="370" stroke="#FDE68A" stroke-opacity="0.06" stroke-width="0.6"/>
    <line x1="344" y1="355" x2="256" y2="370" stroke="#FDE68A" stroke-opacity="0.05" stroke-width="0.6"/>
  </g>
</svg>
