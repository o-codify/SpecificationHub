name: Docker

on:
  push:
    # Only the default branch — pushes to ai/*, edit/*, etc. never build.
    branches: [main]
    # Only application/build logic. Note: docs/** is intentionally NOT listed,
    # so doc edits (incl. those merged into main via the app) do NOT trigger a
    # rebuild — the image carries no docs (GitHub is the source of truth).
    paths:
      - "apps/**"
      - "packages/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          VERSION="$(date -u +%Y.%-m%d).${{ github.run_number }}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          # Single container: the root Dockerfile builds web + api and the
          # backend serves the frontend. Context = monorepo root so it can
          # COPY apps/* and packages/*.
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hls-hub:latest
            ghcr.io/${{ github.repository_owner }}/hls-hub:${{ steps.version.outputs.VERSION }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Trigger Coolify deploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK secret not set — skipping deploy."
            exit 0
          fi
          curl -f -X POST "$COOLIFY_WEBHOOK" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
