services:
  specification-hub:
    build: .
    image: specification-hub:latest
    ports:
      - "8080:8080"
    environment:
      # Postgres connection (tokens, sessions, OAuth clients/tokens). Persists
      # across redeploys — unlike the /data volume.
      - DATABASE_URL=${DATABASE_URL:-postgres://spec:spec@postgres:5432/spec}
      # Admin UI login (used at /admin). If the password is unset, one is
      # generated on first boot and printed to the logs (and /data/admin-password.txt).
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Public base URL for OAuth metadata (behind a proxy). Optional — derived
      # from X-Forwarded-* headers if unset.
      - PUBLIC_URL=${PUBLIC_URL:-}
      # Site brand / title shown in the UI. Each prod can set its own.
      - BRAND_NAME=${BRAND_NAME:-Specification Hub}
      # Docs live in a SEPARATE repository. Point GITHUB_REPO at it (e.g.
      # o-codify/HumanLocomotionSpecificationDocs) with a PAT (Contents + Pull
      # requests write). GitHub becomes the source of truth: the app clones it,
      # serves/edits docs, pushes commits and opens PRs there.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPO=${GITHUB_REPO:-}
    volumes:
      - spec-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-spec}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-spec}
      - POSTGRES_DB=${POSTGRES_DB:-spec}
    volumes:
      - spec-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spec} -d ${POSTGRES_DB:-spec}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  spec-data:
  spec-pg:
